<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CX Studios Offerings</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="offerings-page">
        <!-- Main Table Container -->
        <div class="table-container">
            <table class="offerings-table">
                <thead>
                    <tr>
                        <th class="table-heading">Our Offerings</th>
                        <th class="table-heading">Clients</th>
                        <th class="table-heading">Prototypes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="table-cell">
                            <a href="http://cx-marketplace.s3-website.us-east-2.amazonaws.com" target="_blank" rel="noopener noreferrer" class="card-link-wrapper">
                                <div class="offering-card" data-offering="marketplace">
                                    <div class="offering-background"></div>
                                    <p class="offering-title">Marketplace</p>
                                    <div class="offering-icon icon-marketplace-container">
                                        <img src="images/marketplace-img.svg" alt="Marketplace Icon" class="icon-marketplace">
                                    </div>
                                </div>
                            </a>
                        </td>
                        <td class="table-cell">
                            <a href="http://aci-cxstudios.s3-website.us-east-2.amazonaws.com" target="_blank" rel="noopener noreferrer" class="card-link-wrapper">
                                <div class="offering-card" data-offering="insites">
                                    <div class="offering-background"></div>
                                    <p class="offering-title">ACI Playbook</p>
                                    <div class="offering-icon icon-insites-container">
                                        <img src="http://localhost:3845/assets/c6f4ef08ed6abb141152bf6d3236c26e1bd8bac7.svg" alt="Insites Icon" class="icon-insites">
                                    </div>
                                </div>
                            </a>
                        </td>
                        <td class="table-cell">
                            <a href="http://mercer-job-solution.s3-website.us-east-2.amazonaws.com" target="_blank" rel="noopener noreferrer" class="card-link-wrapper">
                                <div class="offering-card" data-offering="content-lake">
                                    <div class="offering-background"></div>
                                    <p class="offering-title">Mercer Job Soultion</p>
                                    <div class="offering-icon icon-content-lake-container">
                                        <img src="images/mercer-job-soultion-img.svg" alt="Content Lake Icon" class="icon-content-lake">
                                    </div>
                                </div>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td class="table-cell">
                            <a href="http://cxstudios-insites.s3-website.us-east-2.amazonaws.com" target="_blank" rel="noopener noreferrer" class="card-link-wrapper">
                                <div class="offering-card" data-offering="insites">
                                    <div class="offering-background"></div>
                                    <p class="offering-title">Insites</p>
                                    <div class="offering-icon icon-insites-container">
                                        <img src="images/insites-img.svg" alt="Insites Icon" class="icon-insites">
                                    </div>
                                </div>
                            </a>
                        </td>
                        <td class="table-cell">
                            <a href="http://cloud-scal3.s3-website.us-east-2.amazonaws.com" target="_blank" rel="noopener noreferrer" class="card-link-wrapper">
                                <div class="offering-card" data-offering="marketplace">
                                    <div class="offering-background"></div>
                                    <p class="offering-title">Cloud Scal3</p>
                                    <div class="offering-icon icon-marketplace-container">
                                        <img src="images/marketplace-img.svg" alt="Marketplace Icon" class="icon-marketplace">
                                    </div>
                                </div>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="cta-section">
            <div class="cta-background-image">
                <img src="http://localhost:3845/assets/547fbfcb4fee29bacdf7412e25aef909ce0e77d4.png" alt="" class="cta-bg-img">
                <div class="cta-bg-overlay"></div>
            </div>
            <div class="cta-content">
                <div class="cta-text-container">
                    <h2 class="cta-heading">Discover what we can do for you</h2>
                    <p class="cta-description">Get a hands-on look at how intelligent automation fuels efficiency, scalability, and customer loyalty.</p>
                </div>
                <!-- <div class="cta-form">
                    <input type="email" class="email-input" placeholder="name@email.com">
                    <button class="contact-button">Contact US</button>
                </div> -->
            </div>
        </div>
    </div>
</body>
</html>
