<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CX Studios Offerings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-decoration">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="header-badge">Featured Projects</div>
            <h1 class="title-animate">CX Studios</h1>
            <p class="subtitle">Crafting Digital Experiences</p>
            <p class="header-description">Explore our collection of innovative web solutions</p>
        </header>

        <div class="websites-grid" id="websitesGrid">
            <!-- Website cards will be dynamically inserted here -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <p>No websites found matching your search.</p>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 CX Studios. Building the future, one pixel at a time.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
